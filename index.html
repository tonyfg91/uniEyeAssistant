<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ESP32-CAM Gallery</title>
  <style>
    body { font-family: sans-serif; }
    #content { display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
<div id="content">
    <h1>ESP32-CAM Images</h1>
    <!-- Filtro per giorno -->
    <label for="dateFilter">Filtra per giorno:</label>
    <input type="date" id="dateFilter">
	
    <div id="gallery"></div>
</div>
<script>
  const hash = "fa44835d0ed33e8aa3b6b8964ec77bfd";

	function md5(str) {
		return CryptoJS.MD5(str).toString();
	}

  const userPass = prompt("Inserisci password:");
  if (CryptoJS.MD5(userPass).toString() === hash) {
	document.getElementById("content").style.display = "block";
	// Data di oggi in formato YYYY-MM-DD
	const today = new Date().toISOString().split("T")[0];
	const dateInput = document.getElementById("dateFilter");
	// Imposta il valore
	dateInput.value = today;
  } else {
    document.body.innerHTML = "<h2>Accesso negato</h2>";
  }
</script>
<script>
// Funzione per estrarre la data dal nome del file
function getDateFromFilename(filename) {
    // Match YYYYMMDD
    const match = filename.match(/(\d{4})(\d{2})(\d{2})_/);
    if (!match) return "";

    const year = match[1];
    const month = match[2];
    const day = match[3];
	
	return `${year}-${month}-${day}`;
}

// Funzione per mostrare la galleria
function renderGallery(images, filterDate = "") {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    const filteredImages = images.filter(img => {
        if (!filterDate) return true;
        return getDateFromFilename(img) === filterDate;
    });

    if (filteredImages.length === 0) {
        gallery.innerHTML = "<p>Nessuna immagine trovata per questa data.</p>";
        return;
    }

    filteredImages.forEach(img => {
        const div = document.createElement("div");
        div.style.marginBottom = "20px";

        const imageElement = document.createElement("img");
        imageElement.src = img;
        imageElement.style.maxWidth = "300px";
        imageElement.style.display = "block";

        const caption = document.createElement("p");
        caption.textContent = img.split("/").pop();

        div.appendChild(imageElement);
        div.appendChild(caption);
        gallery.appendChild(div);
    });
}

// Carica il JSON con tutte le immagini
var myJson = 'images.json?nocache=' + (new Date()).getTime();
fetch(myJson)
    .then(response => response.json())
    .then(images => {
        renderGallery(images);

        // Aggiorna la galleria al cambio di data
        document.getElementById("dateFilter").addEventListener("change", (e) => {
            renderGallery(images, e.target.value);
        });
    })
    .catch(err => {
        console.error("Errore caricamento immagini:", err);
        document.getElementById("gallery").innerHTML = "<p>Impossibile caricare le immagini.</p>";
    });
</script>
</body>
</html>
